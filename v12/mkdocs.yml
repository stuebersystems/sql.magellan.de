site_name: Magellan 12 DB
site_author: STÜBER SYSTEMS GmbH
site_description: Dokumentation der Magellan 12 Datenbankstruktur

copyright:
  '&copy; 2026 STÜBER SYSTEMS GmbH : <a href="https://legal.stueber.de/imprint.php">Impressum</a> : <a href="https://legal.stueber.de/privacy.php">Datenschutz</a>'

theme: 
  name: material
  language: de
  features:
    - navigation.footer
    - navigation.instant
    - navigation.sections   
    - navigation.top
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow
  static_templates:
    - 404.html
  palette:
    - scheme: default
      primary: 'blue'
      accent: 'deep orange'
      toggle:
        icon: material/brightness-7
        name: In den Dunkelmodus wechseln
    - scheme: slate
      primary: 'blue'
      accent: 'deep orange'
      toggle:
        icon: material/brightness-4
        name: In den Hellmodus wechseln
  font: false

extra:
  version:
    provider: mike
    
extra_css:
  - assets/css/custom.css

plugins:
  - search
  - awesome-pages
  - minify:
      minify_html: true
  
markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
